{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="narrow">
  <div class="card">
    <h1>Welcome back</h1>
    <form method="post" class="stack">
      {{ csrf() }}
      <div><label for="email">Email</label><input id="email" type="email" name="email" required autofocus value="{{ request.form.email }}"></div>
      <div><label for="password">Password</label><input id="password" type="password" name="password" required></div>
      <button class="btn block" type="submit">Log in</button>
    </form>
    <p class="muted small" style="margin-top:14px">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
